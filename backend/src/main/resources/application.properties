logging.pattern.level=%5p [%X{requestId:-}]
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
qrpay.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
# 10,000.00 INR credited to new customers
qrpay.demo.signup-bonus=1000000
qrpay.idempotency.ttl=PT24H
qrpay.jobs.expiry-interval-ms=15000
qrpay.jobs.reconciliation-interval-ms=300000
qrpay.kafka.partitions=6
qrpay.kafka.payment-events-topic=payment.events
qrpay.kafka.replication-factor=1
qrpay.outbox.batch-size=100
qrpay.outbox.poll-interval-ms=300
qrpay.outbox.retention=P7D
qrpay.payment.currency=INR
qrpay.payment.lock-ttl=PT15S
# 1,00,000.00 INR in paise
qrpay.payment.max-amount=10000000
qrpay.payment.pending-ttl=PT5M
qrpay.qr.default-expiry=PT5M
qrpay.qr.max-expiry=PT30M
qrpay.qr.scheme=qrpay
qrpay.qr.signing-secret=${QR_SIGNING_SECRET:ZGV2LW9ubHktcXItc2lnbmluZy1rZXktY2hhbmdlLW1lLXBsZWFzZS0xMjM0NQ==}
qrpay.rate-limit.buckets.auth=20
qrpay.rate-limit.buckets.payments=30
qrpay.rate-limit.buckets.qr-create=60
qrpay.rate-limit.buckets.qr-resolve=60
qrpay.rate-limit.window=PT1M
# 256-bit keys, base64. Override in every non-local environment.
qrpay.security.jwt-secret=${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtcGxlYXNlLTEyMzQ1Njc4OTA=}
qrpay.security.jwt-ttl=PT12H
qrpay.security.pin-lockout=PT15M
qrpay.security.pin-max-attempts=5
qrpay.webhook.connect-timeout=PT2S
qrpay.webhook.dev-sink-enabled=true
qrpay.webhook.read-timeout=PT5S
# a rotated-out signing secret keeps verifying for this long
qrpay.webhook.secret-grace-period=PT24H
server.port=${PORT:8080}
server.shutdown=graceful
spring.application.name=qr-payment-service
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.password=${DB_PASSWORD:qrpay}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/qrpay}
spring.datasource.username=${DB_USER:qrpay}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.threads.virtual.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
